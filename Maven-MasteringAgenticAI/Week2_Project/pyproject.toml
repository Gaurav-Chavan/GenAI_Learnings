[project]
name = "orggraph-rag"
version = "0.1.0"
description = "GraphRAG vs. vector RAG over an organizational knowledge graph (Neo4j + LangGraph + Streamlit)"
readme = "README.md"
authors = [
    { name = "Gaurav-Chavan", email = "gaurav.g.chavan11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.0,<2.0",
    "langchain-neo4j>=0.11.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "neo4j>=6.4.1",
    "openai>=3.41.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]
